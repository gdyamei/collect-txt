name: 'Daily Job(special)'

on:
  schedule:
    - cron: '30 23 * * *'  # UTC
  workflow_dispatch:
    inputs:
      environment:
        description: 'Daily Job(special)'
        required: true
        default: 'production'

jobs:
  run_job:
    runs-on: ubuntu-latest
    
    steps:
    #- name: Checkout code
  - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # ✨ 關鍵 1：設定 fetch-depth 為 0，拉取完整歷史，這樣 pull --rebase 才能正常運作
        fetch-depth: 0      
        
    - name: Set up Python
      uses: uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        
    - name: Run Python script
      run: python assets/special/special.py
          
    - name: Commit changes
      run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add assets/special/special.txt
         # ✨ 關鍵 2：在 Commit 前拉取遠端最新修改並進行基底重設 (Rebase)
          git pull --rebase origin main
          
          if git diff-index --quiet HEAD --; then
            echo "沒有變更，跳過 Commit。"
          else
            git commit -m ":tv: (special)AutoUpdate $(date -d "+8 hours" +'%Y%m%d')"
          fi
          
    - name: Push changes
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: main
        force: true # 强制推送，覆盖远程分支
       directory: 
        
